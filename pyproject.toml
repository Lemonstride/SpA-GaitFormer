[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spa-gaitformer"
version = "0.1.0"
description = "Reproducible tri-modal SpA movement assessment pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.2",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
opengait = ["einops>=0.6", "opencv-python>=4.8", "tqdm>=4.65"]

[project.scripts]
spa-build-manifest = "spa_gaitformer.manifest:main"
spa-make-splits = "spa_gaitformer.splits:main"
spa-train = "spa_gaitformer.train:main"
spa-evaluate = "spa_gaitformer.evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spa_gaitformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
