seed: 2026
task: binary

data:
  image_size: 224
  ratio_rgb_to_rd: 3
  rd_window: 10
  rd_stride: 5
  num_workers: 4
  rd_normalization: per_window
  augmentation:
    enabled: true
    policy: subject_cycle_rgb32_v1
    seed: 2026
    skeleton:
      noise_std: 0.0
      feature_dropout_p: 0.0
    radar:
      amplitude_scale: [1.0, 1.0]
      noise_std: 0.0
    temporal:
      mask_p: 0.0

model:
  num_classes:
    binary: 2
    severity: 4
  shared_dim: 256
  dropout: 0.1
  rgb:
    backend: vit_b_16
    checkpoint: null
    trainable: true
  skeleton:
    backend: skeletongait_pp
    feature_dim: 4096
    checkpoint: null
    trainable: true
    opengait_root: /vepfs/group02/USER/fanzu/codes/SpA-GaitFormer/third_party/OpenGait
    blocks: [1, 1, 1, 1]
    channel_multiplier: 2
  radar:
    cnn_channels: 64
    transformer_layers: 2
    transformer_heads: 8
  fusion:
    layers: 3
    heads: 8
    mlp_ratio: 4
  headturn:
    enabled: true

training:
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0
  batch_size: 2
  gradient_accumulation_steps: 8
  mixed_precision: true
  epochs: 50
  loss: cross_entropy
  class_weights: null
  sampling: subject_class_balanced
  primary_metric: subject_macro_f1

evaluation:
  repeats: 5
  train_ratio: 0.70
  val_ratio: 0.15
  subject_independent: true

